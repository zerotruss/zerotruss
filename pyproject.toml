[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zerotruss"
version = "0.1.0"
description = "An audit and boundary checkpoint for MCP tool calls, as an agentgateway guardrail"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["zerotruss"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.in"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
